<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Flying Whale – 10 styles</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

.list button{display:flex;gap:10px;width:100%;text-align:left;font:inherit;font-size:14.5px;font-weight:600;padding:8px 10px;border:0;border-radius:9px;background:transparent;color:#1b1d3a;cursor:pointer}
.list button i{font-style:normal;color:#b9b3a8;width:20px}
.list button.on{background:#fff;box-shadow:0 2px 10px #0001}.list button.on i{color:#f0562f}
canvas{width:100%;height:auto;display:block;border-radius:22px;border:5px solid #1b1d3a;background:#000}

</style>
</head>
<body>
<div class="wrap">
  <div><h1>Flying whale<br><span>10 styles</span></h1><div class="list" id="list"></div>
    <p class="note">One scene, drawn in code, restyled ten ways. It loops every 6 seconds. Tap a style, or leave it to change by itself.</p></div>
  <div><canvas id="cv" width="540" height="960"></canvas></div>
</div>
<script>
const cv=document.getElementById('cv'),X=cv.getContext('2d'),W=540,H=960,LOOP=6,TAU=Math.PI*2;

// ---------- helpers ----------

function P(path,fill,o={}){ // paint one shape in the current style

  c.save();c.translate(.28*s,.3*s);c.rotate(.5+Math.sin(u*TAU*3)*.3);P(()=>{c.beginPath();c.ellipse(-.02*s,.14*s,.1*s,.24*s,0,0,TAU);},top,{box,lc});c.restore();

  else{c.fillStyle='#fff';c.beginPath();c.arc(.62*s,-.1*s,.1*s,0,TAU);c.fill();c.fillStyle=ink;c.beginPath();if(st.pie){c.moveTo(.63*s,-.1*s);c.arc(.63*s,-.1*s,.075*s,.5,TAU-.3);}else c.arc(.64*s,-.1*s,.062*s,0,TAU);c.fill();

  c.strokeStyle=ink;c.lineWidth=2;c.lineCap='round';c.beginPath();c.arc(.72*s,.1*s,.13*s,.35,1.9);c.stroke();
  c.restore();}
function person(p,gy,u,wx){const x=p.x,bob=Math.abs(Math.sin(u*TAU*3+p.p))*4,y=gy-bob,look=cl((wx-x)/260,-1,1),col=st.people,lc=st.olAlt?st.olAlt[2]:null;

  if(st.extra==='rays'){c.strokeStyle='#000';c.lineWidth=2;for(let i=0;i<26;i++){const a=i/26*TAU+u*TAU/26;c.beginPath();c.moveTo(W*.52+Math.cos(a)*96,H*.2+Math.sin(a)*96);c.lineTo(W*.52+Math.cos(a)*900,H*.2+Math.sin(a)*900);c.stroke();}}

  c.save();c.translate(-cam*1.15,0);people.forEach(p=>person(p,gy+52,u,wx));c.restore();
  drawClouds(2);
  if(st.extra==='branch'){c.strokeStyle='#191817';c.lineCap='round';const sw=Math.sin(u*TAU)*4;c.lineWidth=9;c.beginPath();c.moveTo(-10,60);c.quadraticCurveTo(140,70+sw,250,130+sw);c.stroke();c.lineWidth=4;c.beginPath();c.moveTo(120,72);c.quadraticCurveTo(170,40,220,30+sw);c.moveTo(190,104);c.quadraticCurveTo(240,150,300,150+sw*1.5);c.stroke();
    [[220,30],[250,130],[300,150],[160,58],[205,112]].forEach(([x,y],i)=>{c.fillStyle='#b03a2e';c.beginPath();c.arc(x,y+sw,5,0,TAU);c.fill();});
    for(let i=0;i<5;i++){const t=(u+i/5)%1;c.fillStyle='rgba(176,58,46,.8)';c.beginPath();c.ellipse(120+i*50+t*80,60+t*H*.9,4,2.4,t*9+i,0,TAU);c.fill();}}}
// ---------- frame ----------
function frame(now){const t=(now/1000)%LOOP,u=t/LOOP;if(auto){const k=Math.floor(now/1000/LOOP)%S.length;if(k!==cur)pick(k,true);}
  st=S[cur];const res=st.res||1;sc.width=Math.round(W*res);sc.height=Math.round(H*res);c.setTransform(sc.width/W,0,0,sc.height/H,0,0);
  if(st.post==='film')c.translate(Math.sin(now/90)*1.2,Math.cos(now/70)*1.2);
  scene(u);X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';
  if(st.post==='brick'){const d=c.getImageData(0,0,sc.width,sc.height).data,q=W/sc.width;for(let y=0;y<sc.height;y++)for(let x=0;x<sc.width;x++){const i=(y*sc.width+x)*4,r=d[i]>>5<<5,g=d[i+1]>>5<<5,b=d[i+2]>>5<<5;
      X.fillStyle=`rgb(${r+16},${g+16},${b+16})`;X.fillRect(x*q,y*q,q,q);X.fillStyle='rgba(0,0,0,.22)';X.fillRect(x*q,y*q+q-1.5,q,1.5);X.fillRect(x*q+q-1.5,y*q,1.5,q);
      X.fillStyle='rgba(255,255,255,.3)';X.beginPath();X.arc(x*q+q/2,y*q+q/2,q*.3,0,TAU);X.fill();X.fillStyle='rgba(0,0,0,.14)';X.beginPath();X.arc(x*q+q/2+.8,y*q+q/2+1,q*.3,.2,Math.PI);X.fill();}}
  else{X.imageSmoothingEnabled=!st.nearest;X.drawImage(sc,0,0,W,H);}
  const nz=noise[Math.floor(now/90)%3],ov=(op,a)=>{X.globalCompositeOperation=op;X.globalAlpha=a;X.drawImage(nz,0,0,W,H);X.globalAlpha=1;X.globalCompositeOperation='source-over';};
  if(st.post==='paper'){ov('multiply',.07);ov('soft-light',.16);}
  if(st.post==='film'){ov('overlay',.2);X.fillStyle='rgba(20,14,6,.5)';for(let i=0;i<2;i++){const x=(Math.sin(now/300+i*40)*.5+.5)*W;X.fillRect(x,0,1,H);}
    X.fillStyle=`rgba(255,240,200,${.04+.04*Math.sin(now/45)})`;X.fillRect(0,0,W,H);const v=X.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.72);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(20,12,0,.7)');X.fillStyle=v;X.fillRect(0,0,W,H);}
  if(st.post==='halftone'){X.fillStyle='rgba(0,0,0,.16)';for(let y=0;y<H;y+=7)for(let x=(y/7%2)*3.5;x<W;x+=7){X.beginPath();X.arc(x,y,1.1,0,TAU);X.fill();}}
  if(st.post==='scan'){X.fillStyle='rgba(0,0,0,.33)';for(let y=0;y<H;y+=4)X.fillRect(0,y,W,2);X.fillStyle=`rgba(57,255,176,${.03+.02*Math.sin(now/60)})`;X.fillRect(0,0,W,H);const v=X.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.8)');X.fillStyle=v;X.fillRect(0,0,W,H);}
  if(st.post==='knit'){X.globalCompositeOperation='overlay';X.globalAlpha=.75;X.fillStyle=X.createPattern(knit,'repeat');X.fillRect(0,0,W,H);X.globalAlpha=1;X.globalCompositeOperation='source-over';ov('soft-light',.25);}
  if(st.post==='dither'){X.fillStyle='rgba(0,0,0,.07)';for(let y=0;y<H;y+=4)for(let x=(y/4%2)*2;x<W;x+=4)X.fillRect(x,y,2,2);}
  requestAnimationFrame(frame);}
// ---------- UI ----------
const list=document.getElementById('list');S.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=`<i>${i+1})</i>${s.n}`;b.onclick=()=>pick(i);list.appendChild(b);});
function pick(i,fromAuto){cur=i;if(!fromAuto)auto=false;[...list.children].forEach((b,k)=>b.classList.toggle('on',k===i));}
window.pick=pick;pick(0,true);requestAnimationFrame(frame);
</script>
